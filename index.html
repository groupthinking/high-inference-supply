<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>High Inference — Storefront</title>
    <meta
      name="description"
      content="High Inference Shopify Storefront powered by the Shopify Storefront GraphQL API."
    />
    <script type="module" crossorigin src="./assets/index-Bn1tv9eJ.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-fymfHpit.css">
  </head>
  <body>
    <a class="hi-skip" href="#main-content">Skip to content</a>

    <div id="api-banner" class="hi-banner" hidden></div>

    <header class="hi-header" role="banner">
      <div class="hi-header__inner">
        <a href="#catalog" class="hi-header__brand" id="store-brand">
          <svg class="hi-header__mark" viewBox="0 0 28 20" fill="none" aria-hidden="true">
            <path d="M2 16L10.5 3L19 16" stroke="currentColor" stroke-width="1.5" />
            <rect x="21" y="12" width="4" height="4" fill="currentColor" />
          </svg>
          <span id="store-name">High Inference</span>
        </a>

        <nav class="hi-header__nav" aria-label="Primary">
          <a href="#catalog" class="hi-header__link">Catalog</a>
          <a href="#policies" class="hi-header__link">Policies</a>
        </nav>

        <div class="hi-header__actions">
          <button type="button" class="hi-header__btn" id="haptics-toggle" aria-pressed="false">
            Haptics [<span id="haptics-state">Off</span>]
          </button>
          <button
            type="button"
            class="hi-header__btn"
            id="cart-open-btn"
            aria-controls="cart-drawer"
            aria-expanded="false"
          >
            Bag (<span id="cart-count">0</span>)
          </button>
        </div>
      </div>
    </header>

    <main id="main-content" class="hi-main" tabindex="-1">
      <section class="hi-section" id="catalog">
        <div class="hi-wrap">
          <div class="hi-section__head">
            <h1 class="hi-section__title" id="catalog-heading">Catalog</h1>
            <span class="hi-kicker" id="catalog-count">Loading Shopify catalog…</span>
          </div>
          <div id="product-grid" class="hi-grid" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <footer class="hi-footer" id="policies" role="contentinfo">
      <div class="hi-wrap hi-footer__inner">
        <div>
          <p class="hi-footer__name" id="footer-store-name">High Inference</p>
          <p class="hi-footer__note">
            Powered by Shopify Storefront GraphQL API (2026-01) · Native Shopify Checkout
          </p>
        </div>
        <nav class="hi-footer__policies" id="policy-links" aria-label="Store policies"></nav>
      </div>
    </footer>

    <!-- Product Detail Modal -->
    <div class="hi-backdrop" id="modal-backdrop" aria-hidden="true"></div>
    <div
      id="product-modal"
      class="hi-modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="modal-title"
    ></div>

    <!-- Policy Reader Modal -->
    <div
      id="policy-modal"
      class="hi-modal"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="policy-modal-title"
    ></div>

    <!-- Real Shopify Cart Drawer -->
    <aside
      id="cart-drawer"
      class="hi-drawer"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="Shopping Bag"
    ></aside>

  </body>
</html>
