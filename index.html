<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HIGH INFERENCE — Edition 01</title>
    <meta
      name="description"
      content="High Inference (highinference.com) — Edition 01. Architectural garments and archival objects for the analog frontier."
    />
    <meta name="theme-color" content="#09090B" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body data-theme="dark">
    <!-- Full-bleed luxury WebGL2 silk-caustic light field -->
    <canvas id="webgl-field" aria-hidden="true"></canvas>

    <!-- Minimal adaptive top navigation -->
    <header id="hud" class="hud hud--dark" role="banner">
      <div class="hud__left">
        <a href="#act-1" class="hud__brand" id="hud-brand" aria-label="High Inference Home">
          <svg class="hud__mark" viewBox="0 0 28 20" fill="none" aria-hidden="true">
            <path d="M2 16L10.5 3L19 16" stroke="currentColor" stroke-width="1.35" />
            <rect x="21" y="12" width="4" height="4" fill="#B58947" />
          </svg>
          <span class="hud__wordmark">HIGH INFERENCE</span>
        </a>
      </div>

      <nav class="hud__chapters" aria-label="Edition chapters">
        <button class="hud__chapter is-active" data-chapter="1" id="nav-act-1">Prologue</button>
        <button class="hud__chapter" data-chapter="2" id="nav-act-2">Garments</button>
        <button class="hud__chapter" data-chapter="3" id="nav-act-3">Objects</button>
        <button class="hud__chapter" data-chapter="4" id="nav-act-4">Editorial</button>
        <button class="hud__chapter" data-chapter="5" id="nav-act-5">Archive</button>
      </nav>

      <div class="hud__right">
        <button
          type="button"
          class="hud__control hud__control--haptics"
          id="haptics-toggle"
          aria-pressed="false"
          title="Toggle opt-in tactile vibration on supported devices"
        >
          <span>Haptics</span>
          <span class="hud__control-val" id="haptics-status">[ Off ]</span>
        </button>

        <button
          type="button"
          class="hud__control hud__control--bag"
          id="bag-toggle"
          aria-label="Open shopping bag"
          aria-controls="bag-drawer"
          aria-expanded="false"
        >
          <span>Bag</span>
          <span class="hud__control-val" id="bag-count">(0)</span>
        </button>
      </div>
    </header>

    <!-- Hairline scroll progress -->
    <div class="scroll-rail" aria-hidden="true">
      <div class="scroll-rail__fill" id="scroll-rail-fill"></div>
    </div>

    <!-- Main 5-Act Editorial Journey -->
    <main id="app-main">
      <section id="act-1" class="act act--hero" data-act="1" data-surface="dark" aria-label="Prologue"></section>
      <section id="act-2" class="act act--apparel" data-act="2" data-surface="light" aria-label="Garments"></section>
      <section id="act-3" class="act act--objects" data-act="3" data-surface="light" aria-label="Objects"></section>
      <section id="act-4" class="act act--spread" data-act="4" data-surface="light" aria-label="Editorial"></section>
      <section id="act-5" class="act act--lineup" data-act="5" data-surface="dark" aria-label="Archive"></section>
    </main>

    <!-- Fullscreen Viewing Room (Product Stage) -->
    <div
      id="product-stage"
      class="stage"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-labelledby="stage-title"
    ></div>

    <!-- Slide-out Shopping Bag Drawer -->
    <aside
      id="bag-drawer"
      class="drawer"
      role="dialog"
      aria-modal="true"
      aria-hidden="true"
      aria-label="Shopping Bag"
    ></aside>

    <!-- Overlay Backdrop -->
    <div id="overlay-backdrop" class="backdrop" aria-hidden="true"></div>

    <!-- Whisper-quiet Toast Feedback -->
    <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
